[build]
  command = "npm run build"
  publish = "src"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."submit-lead"]
  included_files = ["netlify/data/uei-campus-programs.json"]

[[headers]]
  for = "/data/uei-preview-campus-programs.json"
  [headers.values]
    Cache-Control = "no-store"
